version: '3.8'
name: roshid-server

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    volumes:
      - ./backend:/usr/src/app
      - backend_data:/usr/src/app/data
    expose:
      - "4000"
    environment:
      - DEBUG=true
    env_file: ./.env
    command: python src/server.py
    depends_on:
      - mongodb

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      target: development  # Specify the development target
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    command: npm run dev 
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "5000:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  backend_data:
  frontend_node_modules:
  frontend_next:
